[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trlc_dk1"
version = "0.1.0"
dependencies = [
  "numpy>=2.0.1",
  "pyserial>=3.5",
  "dynamixel-sdk>=3.7.31",
  "lerobot@git+https://github.com/robot-learning-co/lerobot.git@trlc-dk1",
  "opencv-python (>=4.12.0.88,<5.0.0.0)",
  "ipykernel (>=7.1.0,<8.0.0)",
  "opencv-python-headless (>=4.12.0.88,<5.0.0.0)",
]
requires-python = ">=3.10,<4.0"

authors = [
  {name = "Jannik Grothusen", email = "jannik@robot-learning.co"},
]
maintainers = [
  {name = "Jannik Grothusen", email = "jannik@robot-learning.co"},
]

[project.urls]
Homepage = "https://www.robot-learning.co/"
Documentation = "https://www.docs.robot-learning.co/"

[tool.hatch.metadata]
allow-direct-references = true